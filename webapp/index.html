<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Финансовая Империя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  background: #0a0a0a; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh; overflow-x: hidden;
}
body { padding: 12px 12px 90px 12px; }

/* Заголовок */
.header-title {
  text-align: center; font-size: 18px; font-weight: 700;
  letter-spacing: 2px; margin-bottom: 12px; color: #fff;
}
.header-title span { color: #FFD700; }

/* Верхние стат-блоки */
.top-stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; margin-bottom: 12px;
}
.top-stat {
  background: #161616; border-radius: 14px; padding: 10px 8px;
  text-align: center; border: 1px solid #222;
}
.top-stat .label {
  font-size: 10px; color: #888; letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 4px;
}
.top-stat .value {
  font-size: 15px; font-weight: 800; color: #FFD700;
}

/* Основной баланс */
.main-balance {
  background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
  border-radius: 18px; padding: 16px 18px; margin-bottom: 12px;
  border: 1px solid #2a2a2a;
  box-shadow: 0 4px 20px rgba(255, 215, 0, 0.05);
}
.main-balance .topline {
  display: flex; justify-content: space-between;
  font-size: 11px; color: #888; margin-bottom: 8px;
  letter-spacing: 1px; text-transform: uppercase;
}
.main-balance .topline .rank { color: #FFD700; font-weight: 700; }
.main-balance .money {
  font-size: 32px; font-weight: 900; color: #FFD700;
  letter-spacing: 1px; text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
}
.main-balance .earned {
  font-size: 12px; color: #666; margin-top: 6px;
}

/* Прогресс */
.progress-block {
  background: #161616; border-radius: 14px; padding: 12px 14px;
  margin-bottom: 12px; border: 1px solid #222;
}
.progress-block .row {
  display: flex; justify-content: space-between;
  font-size: 12px; margin-bottom: 8px;
}
.progress-block .row .label { color: #888; }
.progress-block .row .value { color: #FFD700; font-weight: 700; }
.progress-bar {
  height: 8px; background: #0a0a0a; border-radius: 4px; overflow: hidden;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #FFD700, #FFA500);
  border-radius: 4px; transition: width 0.3s;
}

/* Кнопка клика */
.click-btn {
  width: 100%; height: 120px;
  background: linear-gradient(135deg, #FFD700, #FFA500);
  border: none; border-radius: 20px; margin-bottom: 12px;
  color: #1a1a1a; font-size: 22px; font-weight: 900; letter-spacing: 2px;
  cursor: pointer; transition: transform 0.08s;
  box-shadow: 0 8px 30px rgba(255, 215, 0, 0.3);
}
.click-btn:active { transform: scale(0.96); }
.click-btn .sub { font-size: 12px; opacity: 0.7; display: block; margin-top: 4px; }

/* Табы */
.tabs {
  display: flex; gap: 8px; margin-bottom: 12px;
  overflow-x: auto; padding-bottom: 4px;
}
.tab {
  flex-shrink: 0; padding: 8px 16px; border-radius: 12px;
  background: #161616; border: 1px solid #222;
  color: #888; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.tab.active {
  background: #FFD700; color: #1a1a1a; border-color: #FFD700;
}

/* Карточки */
.card {
  background: #161616; border-radius: 14px; padding: 14px;
  margin-bottom: 8px; border: 1px solid #222;
  display: flex; align-items: center; gap: 12px;
}
.card .icon {
  font-size: 32px; width: 50px; height: 50px;
  display: flex; align-items: center; justify-content: center;
  background: #0a0a0a; border-radius: 12px; flex-shrink: 0;
}
.card .info { flex: 1; min-width: 0; }
.card .name {
  font-size: 14px; font-weight: 700; margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card .desc { font-size: 11px; color: #888; line-height: 1.4; }
.card .desc .gold { color: #FFD700; }
.card .buy-btn {
  background: #FFD700; color: #1a1a1a; border: none;
  padding: 8px 14px; border-radius: 10px;
  font-size: 12px; font-weight: 800; cursor: pointer;
  white-space: nowrap; transition: transform 0.08s;
}
.card .buy-btn:active { transform: scale(0.94); }
.card .buy-btn:disabled {
  background: #333; color: #666; cursor: not-allowed;
}
.card.owned { border-color: #FFD700; }

/* Всплывающее уведомление */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #FFD700; color: #1a1a1a;
  padding: 10px 20px; border-radius: 12px; font-weight: 800;
  font-size: 14px; opacity: 0; transition: opacity 0.3s;
  pointer-events: none; z-index: 9999;
}
.toast.show { opacity: 1; }
.toast.lucky { background: linear-gradient(135deg, #FFD700, #FF6B00); }

/* Нижняя навигация */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #0f0f0f; border-top: 1px solid #222;
  display: flex; justify-content: space-around; padding: 8px 0;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
}
.nav-btn {
  flex: 1; background: none; border: none; color: #666;
  font-size: 10px; cursor: pointer; padding: 6px 0;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: color 0.2s;
}
.nav-btn .nav-icon { font-size: 22px; }
.nav-btn.active { color: #FFD700; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="header-title">💰 <span>ФИНАНСОВАЯ</span> ИМПЕРИЯ</div>

<div class="top-stats">
  <div class="top-stat">
    <div class="label">За клик</div>
    <div class="value" id="perClick">1 ₽</div>
  </div>
  <div class="top-stat">
    <div class="label">В секунду</div>
    <div class="value" id="perSecond">0 ₽</div>
  </div>
  <div class="top-stat">
    <div class="label">Уровень</div>
    <div class="value" id="level">1</div>
  </div>
</div>

<div class="main-balance">
  <div class="topline">
    <span id="rankName">🐣 Новичок</span>
    <span class="rank" id="rankLevel">LVL 1</span>
  </div>
  <div class="money" id="balance">0 ₽</div>
  <div class="earned">Заработано всего: <span id="totalEarned">0</span></div>
</div>

<div class="progress-block">
  <div class="row">
    <span class="label">До следующего уровня</span>
    <span class="value" id="progressText">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<button class="click-btn" onclick="doClick()">
  👆 КЛИК
  <span class="sub">заработай деньги</span>
</button>

<div class="tabs">
  <div class="tab active" onclick="switchTab('business')">🏪 Бизнесы</div>
  <div class="tab" onclick="switchTab('upgrade')">⚡ Апгрейды</div>
</div>

<div id="listContainer"></div>

<div class="bottom-nav">
  <button class="nav-btn active"><span class="nav-icon">💰</span>Главная</button>
  <button class="nav-btn"><span class="nav-icon">🏆</span>Топ</button>
  <button class="nav-btn"><span class="nav-icon">👤</span>Профиль</button>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const USER_ID = tg.initDataUnsafe?.user?.id || 0;
const USERNAME = tg.initDataUnsafe?.user?.username || "";

let state = null;
let currentTab = "business";

// Форматирование
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e12) return (n/1e12).toFixed(2) + " трлн";
  if (n >= 1e9)  return (n/1e9).toFixed(2) + " млрд";
  if (n >= 1e6)  return (n/1e6).toFixed(2) + " млн";
  if (n >= 1e3)  return (n/1e3).toFixed(1) + "K";
  return n.toString();
}
function fmtFull(n) {
  return Math.floor(n).toLocaleString('ru-RU') + " ₽";
}

// Загрузка состояния
async function loadState() {
  try {
    const r = await fetch(`/api/state?user_id=${USER_ID}&username=${encodeURIComponent(USERNAME)}`);
    state = await r.json();
    render();
  } catch(e) { console.error(e); }
}

// Отрисовка
function render() {
  if (!state) return;

  document.getElementById("perClick").textContent = fmt(state.per_click) + " ₽";
  document.getElementById("perSecond").textContent = fmt(state.per_second) + " ₽";
  document.getElementById("level").textContent = state.level + 1;
  document.getElementById("balance").textContent = fmtFull(state.balance);
  document.getElementById("totalEarned").textContent = fmt(state.total_earned);
  document.getElementById("rankName").textContent = state.level_emoji + " " + state.level_name;
  document.getElementById("rankLevel").textContent = "LVL " + (state.level + 1);
  document.getElementById("progressFill").style.width = state.progress + "%";
  document.getElementById("progressText").textContent = state.progress.toFixed(1) + "%";

  renderList();
}

function renderList() {
  const container = document.getElementById("listContainer");
  container.innerHTML = "";

  const items = currentTab === "business" ? state.businesses : state.upgrades;

  items.forEach(item => {
    const canBuy = state.balance >= item.current_price;
    const card = document.createElement("div");
    card.className = "card" + (item.owned > 0 ? " owned" : "");
    const desc = currentTab === "business"
      ? `💵 Доход: <span class="gold">+${fmt(item.income)} ₽/сек</span>`
      : `👆 К клику: <span class="gold">+${fmt(item.bonus)} ₽</span>`;
    card.innerHTML = `
      <div class="icon">${item.emoji}</div>
      <div class="info">
        <div class="name">${item.name} ${item.owned > 0 ? '(' + item.owned + ')' : ''}</div>
        <div class="desc">${desc}<br>Цена: ${fmtFull(item.current_price)}</div>
      </div>
      <button class="buy-btn" ${canBuy ? '' : 'disabled'} onclick="buy('${currentTab}', ${item.id})">
        ${canBuy ? 'Купить' : 'Мало'}
      </button>
    `;
    container.appendChild(card);
  });
}

// Клик
async function doClick() {
  try {
    const r = await fetch("/api/click", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({user_id: USER_ID})
    });
    const data = await r.json();
    showToast((data.lucky ? "🎉 x5! " : "") + "+" + fmtFull(data.gain), data.lucky);
    tg.HapticFeedback?.impactOccurred("light");
    await loadState();
  } catch(e) { console.error(e); }
}

// Покупка
async function buy(type, id) {
  const url = type === "business" ? "/api/buy_business" : "/api/buy_upgrade";
  const body = type === "business"
    ? {user_id: USER_ID, business_id: id}
    : {user_id: USER_ID, upgrade_id: id};

  try {
    const r = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    if (r.ok) {
      tg.HapticFeedback?.notificationOccurred("success");
      showToast("✅ Куплено!");
      await loadState();
    } else {
      showToast("❌ Не хватает денег");
      tg.HapticFeedback?.notificationOccurred("error");
    }
  } catch(e) { console.error(e); }
}

// Табы
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  event.target.classList.add("active");
  renderList();
}

// Тост
let toastTimer;
function showToast(text, lucky=false) {
  const t = document.getElementById("toast");
  t.textContent = text;
  t.className = "toast show" + (lucky ? " lucky" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = "toast", 1200);
}

// Автообновление пассивного дохода
setInterval(loadState, 5000);

loadState();
</script>
</body>
</html>
